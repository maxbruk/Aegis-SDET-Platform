[project]
name = "sdet-enterprise-framework"
version = "1.0.0"
description = "Enterprise-Grade Python SDET Test Automation Platform & Storefront"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Max Bruk" }
]
dependencies = [
    "playwright>=1.45.0",
    "pytest>=8.2.0",
    "pytest-playwright>=0.5.0",
    "pytest-xdist>=3.6.1",
    "pytest-html>=4.1.1",
    "allure-pytest>=2.13.5",
    "pydantic[email]>=2.7.4",
    "pydantic-settings>=2.3.4",
    "email-validator>=2.1.0",
    "httpx>=0.27.0",
    "faker>=25.8.0",
    "pillow>=10.3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["framework"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-v --html=reports/report.html --self-contained-html --alluredir=reports/allure-results"
markers = [
    "api: API integration and contract tests",
    "ui: End-to-end user interface tests",
    "resilience: Chaos and network fault injection tests",
    "performance: Core Web Vitals and CDP telemetry tests",
    "visual: Pixel-level visual regression tests",
    "a11y: Automated WCAG 2.1 AA accessibility tests",
    "smoke: Critical path smoke tests",
    "slow: Tests with network or browser delays",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
